<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/build/assets/app-ChARlLZx.css"><title>Fields QA</title><style>.qa{padding:14px;display:grid;gap:12px}.qa h2{margin:0}.qa-search,.pos-search,.staff-order-search,.admin-menu-search{position:relative;display:block}.checkout-cash-input-shell{margin-top:0!important}.order-line-note-row{display:block}.qa label{min-width:0}</style></head>
<body><main id="page-content"></main><div id="modal-root"></div><script>
const role=new URLSearchParams(location.search).get('role')||'admin';document.body.dataset.role=role;
if(role==='admin'){document.querySelector('#modal-root').innerHTML=`<section class="modal"><div class="modal-body qa"><h2>Admin fields</h2><label>Tên phương thức<input id="generic-text" placeholder="Nhập tên phương thức"></label><label>Số tài khoản<input id="generic-number" type="number" placeholder="Nhập số tài khoản"></label><label>Loại<select id="generic-select"><option>QR / chuyển khoản</option></select></label><label>Ghi chú<textarea id="generic-area" placeholder="Nhập ghi chú thêm"></textarea></label><label class="admin-menu-search"><input id="compact-search" type="search" placeholder="Tìm tên món…"></label></div></section>`}else{document.querySelector('#modal-root').innerHTML=`<section class="modal pos-order-modal"><div class="modal-body qa"><h2>POS fields</h2><label>Tên khách<input id="generic-text" placeholder="Nhập tên khách"></label><label>Số lượng<input id="generic-number" type="number" placeholder="Nhập số lượng"></label><label>Vị trí<select id="generic-select"><option>Bàn 1</option></select></label><label>Ghi chú<textarea id="generic-area" placeholder="Nhập ghi chú thêm"></textarea></label><label class="pos-search"><input id="compact-search" type="search" placeholder="Tìm tên món…"></label><div class="order-line-note-row"><input id="note-field" data-modal-note placeholder="Ghi chú (ít đá, ngọt vừa…)"></div></div></section><section class="modal pos-checkout-modal"><div class="checkout-cash-label"><div id="cash-shell" class="checkout-cash-input-shell"><input class="checkout-cash-input" value="200"><span class="checkout-cash-thousands">.000</span></div></div></section>`}
addEventListener('load',()=>requestAnimationFrame(()=>{const read=id=>{const e=document.getElementById(id);const s=getComputedStyle(e);const p=getComputedStyle(e,'::placeholder');return{height:Math.round(e.getBoundingClientRect().height),font:s.fontSize,weight:s.fontWeight,radius:s.borderRadius,placeholder:p.fontSize}};const result={qaFields:true,role,width:innerWidth,clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,text:read('generic-text'),number:read('generic-number'),select:read('generic-select'),area:read('generic-area'),search:read('compact-search')};if(role==='employee'){result.note=read('note-field');result.cash={height:Math.round(document.querySelector('#cash-shell').getBoundingClientRect().height),font:getComputedStyle(document.querySelector('#cash-shell')).fontSize}}parent.postMessage(result,'*')}));
</script></body></html>
